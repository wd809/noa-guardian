const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.shield}"/></svg>`;
const orb=()=>'<span class="orb" aria-hidden="true"></span>';
const wave=()=>`<span class="wave" aria-hidden="true">${[10,19,13,28,21,34,17,26,15,22,10].map((h,i)=>`<i style="--h:${h}px;--d:${i*.1}s"></i>`).join('')}</span>`;
const state={view:'home',mode:'guardian',voice:false,zoom:1,question:'NOA, ¿qué ocurre cerca?',answer:'Hay un cierre de calle reportado a tres cuadras.',secondary:'Puedes consultar una ruta alternativa.',bright:false,image:null};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['home','Inicio','home'],['map','Mapa','map'],['alerts','Alertas','bell'],['places','Lugares','pin'],['settings','Configuración','settings']];
function sidebar(map=false){return `<aside class="sidebar"><button class="brand ${map?'shield-brand':''}" data-view="home" aria-label="NOA Guardian, ir a inicio">${map?icon('shield')+'<div><strong>NOA</strong><small>GUARDIAN</small></div>':`<span class="wordmark">N${orb()}A</span><small>GUARDIAN</small>`}</button><nav aria-label="Navegación principal">${map?['guardian','citizen','awareness'].map((m,i)=>`<button class="nav-btn ${i===0?'active':''}" data-mode="${m}">${icon(['shield','people','eye'][i])}<span><b>${m[0].toUpperCase()+m.slice(1)}</b><small>${['Tu entorno,<br>con más contexto','Fuentes y jurisdicción','Comprende tu entorno'][i]}</small></span></button>`).join('')+'<hr>':''}${navItems.filter(x=>!map||x[0]!=='home').map(([id,label,ic])=>`<button title="${label}" class="nav-btn ${state.view===id?'active':''}" data-view="${id}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot"><div class="glasses">${icon('glasses')}<div>Diseñado para<br><strong>Meta Glasses</strong></div></div>Tu otra mirada.<br>Tú tienes el control.</div></aside>`}
const locationButton=()=>`<button class="location" data-action="location">${icon('pin')} Reading, PA ${icon('down')}</button>`;
const badge=()=>'<span class="demo">DEMO · Datos simulados</span>';
const switchButton=()=>`<button class="switch" role="switch" aria-label="Avisos por voz" aria-checked="${state.voice}" data-action="voice"></button>`;
function mapSurface(big=false){return `<div class="map-surface real-map" data-realmap="${big?'big':'mini'}"><div class="map-world"></div><span class="map-label">${big?'Mapa real · OpenStreetMap':'Mapa real'} · Eventos simulados</span>${big?`<div class="map-controls"><button data-action="zoom-in" aria-label="Acercar mapa">+</button><button data-action="zoom-out" aria-label="Alejar mapa">−</button><button data-action="recenter" aria-label="Centrar mapa">${icon('arrow')}</button></div><span class="compass">▲<br>N</span>`:''}</div>`}
function miniMap(){return `<div class="mini-map"><div class="mini-head"><span class="event-icon">${icon('road')}</span><div><strong>Cierre de calle</strong><small>N 9th St y Franklin St, Reading, PA</small></div><span class="when">Simulado · hace 3 min</span></div>${mapSurface()}</div>`}
function voiceDock(){return `<div class="voice-dock"><div class="voice-setting">${wave()}<span>Avisos por voz</span>${switchButton()}</div><div class="mic-wrap"><button class="mic" data-action="microphone" aria-label="Hablar con NOA">${icon('mic')}</button><small>Hablar con NOA</small></div><form class="composer" id="ask-form">${icon('keyboard')}<input id="query" aria-label="Pregunta a NOA" placeholder="O escribe tu pregunta aquí…" maxlength="1000" autocomplete="off"><button type="submit" aria-label="Enviar pregunta">${icon('arrow')}</button></form></div>`}
function home(){return `${sidebar()}<main class="main"><header class="topbar">${locationButton()}${badge()}<div class="top-actions"><button class="icon-btn" data-action="brightness" aria-label="Cambiar luminosidad">${icon('sun')}</button><button class="avatar" data-view="settings" aria-label="Preferencias de WD">WD</button></div></header><section class="hero">${orb()}<h1>${state.mode==='citizen'?'Conoce tus derechos.':state.mode==='awareness'?'Activa tu otra mirada.':'¿Qué necesitas saber?'}</h1><p>${state.mode==='citizen'?'Información cívica con fuentes y jurisdicción.':state.mode==='awareness'?'Una nueva perspectiva de lo que te rodea.':'Tu asistente de seguridad personal e inteligencia cívica<br>para un entorno mejor informado.'}</p></section><div class="mode-grid" role="group" aria-label="Modos de NOA">${['guardian','citizen','awareness'].map((m,i)=>`<button class="mode ${state.mode===m?'selected':''}" data-mode="${m}" aria-pressed="${state.mode===m}">${icon(['shield','people','eye'][i])}<span><strong>${m[0].toUpperCase()+m.slice(1)}</strong><small>${['Tu seguridad primero','Fuentes y jurisdicción','Un mayor contexto'][i]}</small></span></button>`).join('')}</div>${state.mode==='guardian'?`<section class="conversation"><div class="messages"><div class="message"><span class="person">${icon('user')}</span><div class="bubble">${escapeHtml(state.question)}</div></div><div class="message">${orb()}<div class="bubble answer" aria-live="polite"><p>${escapeHtml(state.answer)}</p><span class="secondary-text">${escapeHtml(state.secondary)}</span><div class="actions"><button class="pill primary" data-action="route">${icon('arrow')}Mostrar ruta alternativa</button><button class="pill" data-action="detail">Más detalles</button></div></div></div></div>${miniMap()}</section>`:state.mode==='citizen'?`<section class="feature-panel"><h2>¿Sobre qué necesitas orientación?</h2><p>Selecciona un tema para explorar la experiencia de Citizen.</p><div class="topics">${['Vivienda','Trabajo','Consumidor','Tránsito'].map(t=>`<button class="pill" data-topic="${t}">${t}</button>`).join('')}</div><p id="citizen-answer" aria-live="polite">Pensilvania · Estados Unidos</p><small>Vista de diseño. El corpus y las respuestas legales se conectarán mediante Guardian Dock.</small></section>`:`<section class="feature-panel"><div class="camera-area" id="image-preview">${state.image?'<img alt="Imagen seleccionada, solo vista previa local" src="'+state.image+'">':icon('camera')+'<span>Explora una imagen de tu entorno</span>'}</div><label class="pill">Seleccionar imagen <input id="image-file" type="file" accept="image/*"></label><p>Vista previa local. La imagen no se envía a ningún modelo.</p></section>`}${voiceDock()}</main>`}
function eventCard(i){return `<article tabindex="0" role="button" aria-label="Ver detalles: ${i?'Precaución en tu recorrido':'Cierre de calle cercano'}" class="event-card" data-event="${i}"><div class="event-top"><span class="event-icon">${icon(i?'alert':'road')}</span><div><h3>${i?'Precaución en tu recorrido':'Cierre de calle cercano'}</h3><p>⌖ ${i?'Washington St':'N 9th St y Franklin St'}, Reading, PA</p><p>Aproximadamente a ${i?'7':'3'} cuadras de tu ubicación de ejemplo.</p></div>${icon('chevron')}</div><blockquote>${i?'Tráfico lento por incidente en la vía. Podrían presentarse demoras.':'Calle cerrada por trabajos viales. Se muestra una ruta alternativa de ejemplo.'}</blockquote><footer>${icon('file')}Ejemplo simulado · hace 3 min</footer></article>`}
function mapView(){return `${sidebar(true)}<main class="main"><header class="map-top"><div><h1>Tu entorno, con más contexto</h1><p>Alertas y eventos más allá de tu línea de visión.</p></div><div class="topbar">${locationButton()}<button class="icon-btn" data-action="brightness" aria-label="Cambiar luminosidad">${icon('sun')}</button>${badge()}</div></header><div class="map-layout"><section class="large-map" aria-label="Mapa interactivo de demostración">${mapSurface(true)}<div class="map-voice">${wave()}<div><strong>Pregúntale a NOA</strong><small>Ej. “¿Hay algo en mi ruta?”</small></div><button data-action="ask-map" aria-label="Preguntar a NOA">${icon('mic')}</button></div></section><aside class="events-panel"><h2>Eventos cercanos</h2><p>Información relevante más allá de tu línea de visión.</p>${eventCard(0)}${eventCard(1)}<h2>Controles</h2><p>Personaliza tu experiencia mientras te mueves.</p><div class="voice-setting">${icon('speaker')}<span><b>Avisos por voz</b><br><small>Escucha el resumen de esta demo.</small></span>${switchButton()}</div></aside></div></main>`}

const ME4 = { lat: 40.3389, lon: -75.9218 };
const SIM4 = [
  { id: 'cierre', ic: 'road', lat: 40.3417, lon: -75.9190, title: 'Cierre de calle cercano' },
  { id: 'trafico', ic: 'alert', lat: 40.3319, lon: -75.9280, title: 'Precaución en tu recorrido' }
];
const rad4 = d => d * Math.PI / 180;
function worldPx4(lat, lon, z) { const n = 256 * 2 ** z, lr = rad4(lat); return { x: (lon + 180) / 360 * n, y: (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n }; }
function hav4(a, b, c, d) { const R = 6371, x = rad4(c - a), y = rad4(d - b), h = Math.sin(x / 2) ** 2 + Math.cos(rad4(a)) * Math.cos(rad4(c)) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
let activeBigMap = null;
function localPx4(inst, lat, lon) { const st = TILESETS[inst.z], w = worldPx4(lat, lon, inst.z); return { x: w.x - st.x0 * 256, y: w.y - st.y0 * 256 }; }
function applyPan4(inst) { const el = inst.el, st = TILESETS[inst.z], vw = el.clientWidth, vh = el.clientHeight;
  inst.pan.x = st.w <= vw ? (vw - st.w) / 2 : Math.min(0, Math.max(vw - st.w, inst.pan.x));
  inst.pan.y = st.h <= vh ? (vh - st.h) / 2 : Math.min(0, Math.max(vh - st.h, inst.pan.y));
  inst.world.style.transform = `translate(${inst.pan.x}px,${inst.pan.y}px)`; }
function centerOn4(inst, lat, lon) { const p = localPx4(inst, lat, lon); inst.pan.x = inst.el.clientWidth / 2 - p.x; inst.pan.y = inst.el.clientHeight / 2 - p.y; applyPan4(inst); }
function drawPins4(inst) { const layer = inst.world.querySelector('.pin-layer'); layer.innerHTML = '';
  const mp = localPx4(inst, ME4.lat, ME4.lon), d = document.createElement('span');
  d.className = 'me-dot4'; d.style.cssText = `left:${mp.x}px;top:${mp.y}px`; layer.appendChild(d);
  SIM4.forEach(ev => { const p = localPx4(inst, ev.lat, ev.lon), b = document.createElement('button');
    b.type = 'button'; b.className = 'rpin' + (inst.selected && inst.selected.id === ev.id ? ' sel' : '');
    b.style.cssText = `left:${p.x}px;top:${p.y}px`; b.setAttribute('aria-label', ev.title); b.innerHTML = icon(ev.ic);
    b.addEventListener('click', () => { inst.selected = ev; drawRoute4(inst); drawPins4(inst); });
    layer.appendChild(b); }); }
function drawRoute4(inst) { const svg = inst.world.querySelector('.route-svg'); svg.innerHTML = '';
  const chip = inst.world.querySelector('.eta-chip4'); const ev = inst.selected; if (!ev) { chip.style.display = 'none'; return; }
  const a = localPx4(inst, ME4.lat, ME4.lon), c = localPx4(inst, ev.lat, ev.lon), mid = { x: c.x, y: a.y };
  const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  pl.setAttribute('points', `${a.x},${a.y} ${mid.x},${mid.y} ${c.x},${c.y}`);
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#59d8c9'); pl.setAttribute('stroke-width', '3.5'); pl.setAttribute('stroke-dasharray', '2 8'); pl.setAttribute('stroke-linecap', 'round');
  svg.appendChild(pl);
  const km = hav4(ME4.lat, ME4.lon, ev.lat, ev.lon), roadKm = km * 1.35, mins = Math.max(1, Math.round(roadKm / 18 * 60));
  chip.textContent = `${mins} min · ${(roadKm * 0.621371).toFixed(1)} mi`;
  chip.style.left = mid.x + 'px'; chip.style.top = mid.y + 'px'; chip.style.display = 'block'; }
function renderWorld4(inst) { const st = TILESETS[inst.z], w = inst.world;
  w.style.width = st.w + 'px'; w.style.height = st.h + 'px'; w.innerHTML = '';
  for (const [k, src] of Object.entries(st.tiles)) { const [dx, dy] = k.split('_').map(Number); const img = document.createElement('img'); img.src = src; img.alt = ''; img.draggable = false; img.style.cssText = `left:${dx * 256}px;top:${dy * 256}px`; w.appendChild(img); }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'route-svg'); svg.setAttribute('width', st.w); svg.setAttribute('height', st.h); w.appendChild(svg);
  const pins = document.createElement('div'); pins.setAttribute('class', 'pin-layer'); w.appendChild(pins);
  const chip = document.createElement('span'); chip.setAttribute('class', 'eta-chip4'); w.appendChild(chip);
  drawPins4(inst); drawRoute4(inst); }
function buildSurface4(el) { const inst = { el, world: el.querySelector('.map-world'), z: 15, pan: { x: 0, y: 0 }, big: el.dataset.realmap === 'big', selected: SIM4[0] };
  el._inst = inst; renderWorld4(inst);
  if (inst.big) { activeBigMap = inst; centerOn4(inst, ME4.lat, ME4.lon);
    let drag = null;
    el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = { x: e.clientX, y: e.clientY, px: inst.pan.x, py: inst.pan.y }; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => { if (!drag) return; inst.pan.x = drag.px + (e.clientX - drag.x); inst.pan.y = drag.py + (e.clientY - drag.y); applyPan4(inst); });
    el.addEventListener('pointerup', () => drag = null); el.addEventListener('pointercancel', () => drag = null);
  } else centerOn4(inst, SIM4[0].lat, SIM4[0].lon); }
function initRealMaps() { document.querySelectorAll('.real-map').forEach(buildSurface4); }
function mapZoom(z) { const inst = activeBigMap; if (!inst || inst.z === z) return; const vw = inst.el.clientWidth / 2 - inst.pan.x, vh = inst.el.clientHeight / 2 - inst.pan.y;
  const st = TILESETS[inst.z], n = 2 ** inst.z, wx = vw + st.x0 * 256, wy = vh + st.y0 * 256;
  const lon = wx / (256 * n) * 360 - 180, lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * wy / (256 * n)))) * 180 / Math.PI;
  inst.z = z; renderWorld4(inst); centerOn4(inst, lat, lon); }
function mapRecenter() { const inst = activeBigMap; if (!inst) return; if (inst.z !== 15) { inst.z = 15; renderWorld4(inst); } centerOn4(inst, ME4.lat, ME4.lon); }

function render(){document.body.className=(state.view==='map'?'map-mode ':'')+(state.bright?'light':'');document.querySelector('#app').innerHTML=state.view==='map'?mapView():home();bind();}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3600)}
function modal(html){document.querySelector('#dialog-content').innerHTML=html;document.querySelector('#dialog').showModal();}
function detail(index=0){modal(`<span class="demo">EVENTO SIMULADO</span><h2 style="margin-top:20px">${index?'Precaución en tu recorrido':'Cierre de calle cercano'}</h2><p>${index?'Washington St':'N 9th St y Franklin St'}, Reading, PA.</p><p>${index?'El escenario muestra tráfico lento y posibles demoras.':'El escenario muestra un cierre de calle a tres cuadras de la ubicación de ejemplo.'}</p><p>Este evento y su ruta son ilustrativos. No representan un incidente real ni indicaciones de navegación.</p><button class="pill primary" id="detail-map">Ver en el mapa</button>`);document.querySelector('#detail-map').onclick=()=>{document.querySelector('#dialog').close();state.view='map';render()};}
function speak(text){if(!('speechSynthesis'in window)){toast('La lectura por voz no está disponible en este navegador.');return;}const voices=speechSynthesis.getVoices();const local=voices.find(v=>v.localService&&v.lang.startsWith('es'));if(!local){toast('No hay una voz local en español disponible. Puedes leer el resumen en pantalla.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=local;u.lang=local.lang;speechSynthesis.speak(u);}
function ask(text){if(!text.trim())return;state.question=text.trim();if(state.mode==='guardian'){state.answer='En este escenario hay un cierre de calle a tres cuadras.';state.secondary='Respuesta de demostración. Abre el mapa para explorar el evento.';render();if(state.voice)speak(state.answer);}else if(state.mode==='citizen'){document.querySelector('#citizen-answer').textContent='Consulta recibida: '+text+'. Esta vista todavía no consulta el corpus legal; no genera una respuesta jurídica.';}else toast('La vista previa está lista. El análisis de imagen se conectará al Dock.');}
function voiceModal(){modal(`<h2>Hablar con NOA</h2><p>El dictado utiliza el reconocimiento de tu navegador y puede enviar audio a su proveedor. Se activa solo si lo eliges.</p><p>También puedes escribir sin usar el micrófono.</p><button class="pill primary" id="start-voice">Activar dictado</button><p id="voice-status" role="status"></p>`);document.querySelector('#start-voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.querySelector('#voice-status').textContent='Tu navegador no ofrece dictado aquí. Usa el campo de texto.';return;}const rec=new R();rec.lang='es-US';rec.continuous=false;rec.interimResults=false;document.querySelector('#voice-status').textContent='Escuchando…';rec.onresult=e=>{const text=e.results[0][0].transcript;document.querySelector('#dialog').close();ask(text)};rec.onerror=()=>document.querySelector('#voice-status').textContent='No se pudo iniciar el dictado. Revisa el permiso del micrófono o escribe tu pregunta.';document.querySelector('#dialog').addEventListener('close',()=>rec.abort(),{once:true});rec.start();};}
function navigate(view){if(view==='home'||view==='map'){state.view=view;render();return;}if(view==='alerts'){modal(`<h2>Mis alertas</h2><p>2 eventos de demostración en Reading.</p>${eventCard(0)}${eventCard(1)}`);document.querySelectorAll('dialog [data-event]').forEach(e=>e.onclick=()=>{document.querySelector('#dialog').close();state.view='map';render()});}if(view==='places'){modal('<h2>Mis lugares</h2><p>Guarda un nombre durante esta sesión para explorar la interfaz.</p><label>Lugar<input class="dialog-field" id="place-name" placeholder="Ej. Mi casa" maxlength="60"></label><button class="pill primary" id="save-place">Guardar lugar</button><div id="saved-place"></div>');document.querySelector('#save-place').onclick=()=>{const v=document.querySelector('#place-name').value.trim();if(v)document.querySelector('#saved-place').textContent=v+' · guardado solo durante esta sesión';};}if(view==='settings'){modal(`<h2>Tu experiencia</h2><p>Controla cómo se presenta NOA.</p><label><input id="motion-setting" type="checkbox"> Reducir animaciones</label><p>Privacidad: esta demo no usa Meta API, no solicita tu ubicación y no guarda tus preguntas.</p><p>Mapa y eventos ilustrativos. Las imágenes seleccionadas permanecen en esta página.</p><button class="pill" id="clear-session">Limpiar sesión</button>`);document.querySelector('#motion-setting').onchange=e=>{document.documentElement.style.setProperty('--motion',e.target.checked?'paused':'running');document.querySelectorAll('.orb,.wave i').forEach(el=>el.style.animationPlayState=e.target.checked?'paused':'running');let st=document.querySelector('#reduced');if(!st){st=document.createElement('style');st.id='reduced';document.head.append(st)}st.textContent=e.target.checked?'*,*:before,*:after{animation:none!important;transition:none!important}':'';};document.querySelector('#clear-session').onclick=()=>{if(state.image)URL.revokeObjectURL(state.image);state.image=null;state.question='NOA, ¿qué ocurre cerca?';state.answer='Hay un cierre de calle reportado a tres cuadras.';state.secondary='Puedes consultar una ruta alternativa.';state.voice=false;speechSynthesis?.cancel();document.querySelector('#dialog').close();render();toast('Sesión limpiada');};}}
function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>navigate(el.dataset.view));document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;state.view='home';render()});document.querySelectorAll('[data-event]').forEach(el=>{el.onclick=()=>detail(Number(el.dataset.event));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='detail')detail();if(a==='route'){state.view='map';render();toast('Ruta ilustrativa seleccionada · No es navegación real');}if(a==='brightness'){state.bright=!state.bright;render()}if(a==='voice'){state.voice=!state.voice;render();if(state.voice)speak('Demostración de NOA Guardian. Hay un cierre de calle en el escenario de ejemplo.');else window.speechSynthesis?.cancel();}if(a==='microphone')voiceModal();if(a==='ask-map'){state.view='home';state.mode='guardian';render();document.querySelector('#query').focus();}if(a==='zoom-in')mapZoom(15);if(a==='zoom-out')mapZoom(14);if(a==='recenter')mapRecenter();if(a==='location')modal('<h2>Reading, Pensilvania</h2><p>Esta es la ubicación del escenario de demostración. No hemos solicitado ni utilizado tu ubicación real.</p>');});document.querySelector('#ask-form')?.addEventListener('submit',e=>{e.preventDefault();ask(document.querySelector('#query').value)});document.querySelectorAll('[data-topic]').forEach(el=>el.onclick=()=>{document.querySelector('#citizen-answer').textContent=el.dataset.topic+' · Pensilvania. Tema seleccionado. En la versión conectada, aquí aparecerán fragmentos del corpus con citas verificables.';});document.querySelector('#image-file')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>10*1024*1024){toast('Selecciona una imagen de hasta 10 MB.');return;}if(state.image)URL.revokeObjectURL(state.image);state.image=URL.createObjectURL(f);render();});document.querySelectorAll('[data-map]').forEach(m=>{let start=null,x=0,y=0;m.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX-x,y:e.clientY-y};m.setPointerCapture(e.pointerId);};m.onpointermove=e=>{if(!start)return;x=Math.max(-150,Math.min(150,e.clientX-start.x));y=Math.max(-150,Math.min(150,e.clientY-start.y));m.style.setProperty('--pan-x',x+'px');m.style.setProperty('--pan-y',y+'px');};m.onpointerup=()=>start=null;m.onpointercancel=()=>start=null;});initRealMaps();}
document.querySelector('.close').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});render();

</script></body></html>
